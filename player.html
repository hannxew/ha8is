<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔥 VIRAL MOMENT - Video Player</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow: hidden;
        }
        video {
            width: 100%;
            max-width: 100vw;
            max-height: 100vh;
            display: block;
        }
        .player-container {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        .player-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <video 
            src="https://files.catbox.moe/5me8mz.mp4"
            controls
            autoplay
            playsinline
            preload="auto"
        ></video>
    </div>
</body>
</html>

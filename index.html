<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%;
            height: 100%;
            background: #000; 
            overflow: hidden;
        }
        .player-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        .player-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <video 
            src="https://files.catbox.moe/5me8mz.mp4"
            controls
            autoplay
            playsinline
            preload="auto"
        ></video>
    </div>
</body>
</html>
